<header id="cs-navigation">
    <div class="cs-container">
        <!--Nav Logo-->
        <!--Logo is turned white in the css with a filter on dark mode-->
        <a href="/" class="cs-logo" aria-label="Return to Skyline Digital Solutions Home page">
            <img src="/assets/svgs/rectangle-light.svg" alt="" width="210" height="29" aria-hidden="true" decoding="async">
        </a>
        <!--Navigation List-->
        <nav class="cs-nav" aria-label="main navigation">
            <!--Mobile Nav Toggle-->
            <button class="cs-toggle" aria-label="mobile menu toggle" aria-expanded="false" aria-controls="cs-ul-wrapper" aria-haspopup="menu">
                <span class="cs-box" aria-hidden="true">
                    <span class="cs-line cs-line1"></span>
                    <span class="cs-line cs-line2"></span>
                    <span class="cs-line cs-line3"></span>
                </span>
            </button>
            <!-- We need a wrapper div so we can set a fixed height on the cs-ul in case the nav list gets too long from too many dropdowns being opened and needs to have an overflow scroll. This wrapper acts as the background so it can go the full height of the screen and not cut off any overflowing nav items while the cs-ul stops short of the bottom of the screen, which keeps all nav items in view no matter how mnay there are-->
            <div class="cs-ul-wrapper" id="cs-ul-wrapper">
                <ul class="cs-ul">
                    <li class="cs-li">
                        <a href="/" class="cs-li-link {% if page.url == '/' %} cs-active {% endif %}">
                            Home
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/about" class="cs-li-link {% if page.url == '/about/' %} cs-active {% endif %}">
                            About
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/services" class="cs-li-link {% if page.url == '/services/' %} cs-active {% endif %}">
                            Services
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/pricing" class="cs-li-link {% if page.url == '/pricing/' %} cs-active {% endif %}">
                            Pricing
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/faq" class="cs-li-link {% if page.url == '/faq/' %} cs-active {% endif %}">
                            FAQ
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/contact" class="cs-li-link {% if page.url == '/contact/' %} cs-active {% endif %}">
                            Contact
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="cs-contact-group">
            <a href="tel:+16027835033" class="cs-phone">
                <img class="cs-phone-icon" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Icons/phone-1a.svg" alt="" width="24" height="24" aria-hidden="true" decoding="async">
                +1 (602) 783-5033
            </a>
            <div class="cs-social">
                <a href="https://www.facebook.com/skyline.digital.solutions777/" target="_blank" class="cs-social-link" aria-label="Visit our Facebook page">
                    <img class="cs-social-icon" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Images/Icons/facebook-1a.svg" alt="" width="12" height="12" aria-hidden="true" decoding="async">
                </a>

                </a>

                </a>
                <a href="" class="cs-social-link" aria-label="Visit our YouTube page">

    </div>
</header>
